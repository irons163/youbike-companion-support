name: 問題回報 / Bug report
description: 回報 App 操作或站點顯示問題。
title: "[問題] "
body:
  - type: markdown
    attributes:
      value: |
        請提供可重現的操作。此回報內容會公開；個人資料或隱私問題請寄信至 irons7654321@gmail.com。
  - type: input
    id: environment
    attributes:
      label: 裝置、系統與 App 版本
      placeholder: iPhone 16 / iOS 26.4 / App 1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步驟與實際結果
      description: 可補充站點名稱、發生時間，以及 Apple 或 Google 地圖選項。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
    validations:
      required: true
